<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>근현대연표</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button
        class="iconbtn"
        id="sidebtn"
        aria-label="사이드바 보기"
        aria-pressed="true"
        title="사이드바 보기/숨기기"
      >
        <svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true">
          <rect x="1" y="1" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" />
          <line x1="7" y1="1.5" x2="7" y2="14.5" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <h1>근현대연표</h1>
      <span id="count"></span>
      <div class="zoom">
        <div class="seg">
          <button id="zout" title="축소" aria-label="축소">−</button>
          <button id="zfit" title="전체 기간 맞춤">맞춤</button>
          <button id="zin" title="확대" aria-label="확대">+</button>
        </div>
        <input
          id="zslider"
          type="range"
          min="0"
          max="1000"
          step="1"
          aria-label="확대 수준"
        />
        <span id="zlabel"></span>
      </div>
      <div class="search">
        <div class="field">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="5" fill="none" stroke="currentColor" stroke-width="1.6" />
            <line x1="10.3" y1="10.3" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <input
            id="q"
            type="search"
            placeholder="검색"
            aria-label="항목 이름 검색"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <span id="qn" aria-live="polite"></span>
        <button class="iconbtn" id="qprev" aria-label="이전 결과" title="이전 결과 (Shift+Enter)">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><polyline points="2,8 6,4 10,8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="iconbtn" id="qnext" aria-label="다음 결과" title="다음 결과 (Enter)">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><polyline points="2,4 6,8 10,4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </div>
    </header>
    <div class="main">
      <aside id="sidebar" aria-label="분류와 보기 설정">
        <div class="sidectl" id="sidectl"></div>
        <div id="legend"></div>
        <section class="sidesec">
          <h3>보기</h3>
          <div class="opts" id="opts"></div>
        </section>
        <button class="siderow" id="upbtn" aria-expanded="false" aria-controls="unplaced"></button>
      </aside>
      <div id="vp">
        <div id="inner">
          <div id="axis"></div>
          <div id="body"></div>
        </div>
      </div>
    </div>
    <div class="panel" id="unplaced"></div>
    <div id="tip"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
